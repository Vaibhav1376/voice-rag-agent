version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: voice_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true
